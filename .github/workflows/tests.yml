name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  numerical:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 -m pip install numpy
      - run: ./scripts/run-unittests.sh
      - name: Reordered evidence and cache replay
        run: python3 tools/synthetic_sync/run.py --family all --permute --warm --out "${RUNNER_TEMP}/synthetic-numerical"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-numerical
          path: ${{ runner.temp }}/synthetic-numerical
          retention-days: 14

  blender:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BLENDER_VERSION: "5.1.2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 -m pip install numpy
      - name: Cache Blender tarball
        id: blender-tarball
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/blender.tar.xz
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64
      - name: Download Blender
        if: steps.blender-tarball.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 3 -o "${RUNNER_TEMP}/blender.tar.xz" \
            "https://download.blender.org/release/Blender${BLENDER_VERSION%.*}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglu1-mesa libxi6 libxrender1 libxkbcommon0 libsm6 libice6 libxxf86vm1
          mkdir -p "${RUNNER_TEMP}/blender"
          tar -xJf "${RUNNER_TEMP}/blender.tar.xz" -C "${RUNNER_TEMP}/blender" --strip-components=1
          echo "${RUNNER_TEMP}/blender" >> "$GITHUB_PATH"
      - name: Existing Blender smoke test
        run: blender --factory-startup --disable-autoexec -b --python-exit-code 1 --python scripts/validate_addon.py
      - name: Generate cases, collect scene evidence, apply Sync and reopen
        run: |
          for family in ground known_3d free_scale mixed_lines partial_symmetry locked_bridge overhead disconnected collinear; do
            python3 tools/synthetic_sync/run.py --family "$family" --out "${RUNNER_TEMP}/synthetic-blender/cases"
            blender --factory-startup --disable-autoexec -b --python-exit-code 1 \
              --python tools/synthetic_sync/blender_case.py -- \
              --case "${RUNNER_TEMP}/synthetic-blender/cases/${family}-0.json" \
              --out "${RUNNER_TEMP}/synthetic-blender/${family}" --roundtrip
          done
      - name: Constraints supply information and live removal clears stale geometry
        run: |
          python3 tools/synthetic_sync/constraints.py --out "${RUNNER_TEMP}/synthetic-blender/constraints"
          for family in known_lines mirror_points mirror_lines; do
            blender --factory-startup --disable-autoexec -b --python-exit-code 1 \
              --python tools/synthetic_sync/blender_case.py -- \
              --case "${RUNNER_TEMP}/synthetic-blender/constraints/constraint-${family}-0.json" \
              --out "${RUNNER_TEMP}/synthetic-blender/constraint-${family}" --roundtrip --drop-constraint
          done
      - name: Product, probes and captured requests agree on live state
        run: |
          blender --factory-startup --disable-autoexec -b --python-exit-code 1 \
            --python tools/synthetic_sync/verify_jobs.py -- \
            --out "${RUNNER_TEMP}/synthetic-blender/job-inputs"
          blender --factory-startup --disable-autoexec -b --python-exit-code 1 \
            --python tools/synthetic_sync/verify_jobs.py -- --ownership \
            --out "${RUNNER_TEMP}/synthetic-blender/job-ownership"
          blender --factory-startup --disable-autoexec -b --python-exit-code 1 \
            --python tools/synthetic_sync/verify_jobs.py -- --lens-ownership \
            --out "${RUNNER_TEMP}/synthetic-blender/lens-job-ownership"
          blender --factory-startup --disable-autoexec -b --python-exit-code 1 \
            --python tools/synthetic_sync/verify_jobs.py -- --lens-ownership --apply-failures \
            --out "${RUNNER_TEMP}/synthetic-blender/lens-apply-failures"
          blender --factory-startup --disable-autoexec -b --python-exit-code 1 \
            --python tools/synthetic_sync/verify_job_reload.py -- \
            --out "${RUNNER_TEMP}/synthetic-blender/job-reload"
          blender --factory-startup --disable-autoexec -b --python-exit-code 1 \
            --python tools/synthetic_sync/verify_requests.py -- \
            --out "${RUNNER_TEMP}/synthetic-blender/request-parity"
          python3 tools/sync_snapshot.py replay \
            "${RUNNER_TEMP}/synthetic-blender/request-parity/constraints/request.json" \
            --out "${RUNNER_TEMP}/synthetic-blender/request-replay"
      - name: Fit Only cannot supply mirror geometry or leave stale helpers
        run: |
          python3 tools/synthetic_sync/roles.py --out "${RUNNER_TEMP}/synthetic-blender/roles"
          for family in mirror_points mirror_lines; do
            blender --factory-startup --disable-autoexec -b --python-exit-code 1 \
              --python tools/synthetic_sync/blender_case.py -- \
              --case "${RUNNER_TEMP}/synthetic-blender/constraints/constraint-${family}-0.json" \
              --role-case "${RUNNER_TEMP}/synthetic-blender/roles/fit-only-${family}.json" \
              --out "${RUNNER_TEMP}/synthetic-blender/role-${family}" --roundtrip
          done
      - name: Origin preparation preserves withheld object alignment
        run: |
          for state in preset missing_origin locked_origin; do
            blender --factory-startup --disable-autoexec -b --python-exit-code 1 \
              --python tools/synthetic_sync/preparation.py -- \
              --family overhead --state "$state" \
              --out "${RUNNER_TEMP}/synthetic-blender/origin-${state}" --roundtrip
          done
      - name: Ground scale and participation propagate through sparse camera graphs
        run: |
          python3 tools/synthetic_sync/graphs.py --out "${RUNNER_TEMP}/synthetic-blender/graphs"
          blender --factory-startup --disable-autoexec -b --python-exit-code 1 \
            --python tools/synthetic_sync/blender_case.py -- \
            --case "${RUNNER_TEMP}/synthetic-blender/graphs/graph-chain-0.json" \
            --role-case "${RUNNER_TEMP}/synthetic-blender/graphs/graph-fit_only_bridge-0.json" \
            --out "${RUNNER_TEMP}/synthetic-blender/graph-role-change" --roundtrip
      - name: Shared planes preserve ground, lines and withheld object alignment
        run: |
          python3 tools/synthetic_sync/planes.py --out "${RUNNER_TEMP}/synthetic-blender/planes"
          blender --factory-startup --disable-autoexec -b --python-exit-code 1 \
            --python tools/synthetic_sync/blender_case.py -- \
            --case tools/synthetic_sync/cases/free-plane-hard-ground.json \
            --out "${RUNNER_TEMP}/synthetic-blender/plane-ground" --drop-constraint --roundtrip
          blender --factory-startup --disable-autoexec -b --python-exit-code 1 \
            --python tools/synthetic_sync/blender_case.py -- \
            --case "${RUNNER_TEMP}/synthetic-blender/planes/plane-plane_line-0.json" \
            --out "${RUNNER_TEMP}/synthetic-blender/plane-line" --drop-constraint --roundtrip
          python3 tools/synthetic_sync/planes.py --contribution \
            --out "${RUNNER_TEMP}/synthetic-blender/plane-support"
          python3 tools/synthetic_sync/planes.py --mirrored-line \
            --out "${RUNNER_TEMP}/synthetic-blender/plane-mirror"
          blender --factory-startup --disable-autoexec -b --python-exit-code 1 \
            --python tools/synthetic_sync/blender_case.py -- \
            --case tools/synthetic_sync/cases/mirror-lines-with-plane.json \
            --out "${RUNNER_TEMP}/synthetic-blender/plane-mirror-removal" --drop-constraint --roundtrip
          blender --factory-startup --disable-autoexec -b --python-exit-code 1 \
            --python tools/synthetic_sync/blender_case.py -- \
            --case "${RUNNER_TEMP}/synthetic-blender/plane-support/plane-support-x-0.json" \
            --out "${RUNNER_TEMP}/synthetic-blender/plane-support-removal" --drop-constraint --roundtrip
          blender --factory-startup --disable-autoexec -b --python-exit-code 1 \
            --python tools/synthetic_sync/blender_case.py -- \
            --case "${RUNNER_TEMP}/synthetic-blender/plane-support/plane-support-free-0.json" \
            --role-case "${RUNNER_TEMP}/synthetic-blender/plane-support/plane-support-free-0-fit-only.json" \
            --out "${RUNNER_TEMP}/synthetic-blender/plane-support-role" --roundtrip
      - name: Parallel and mirror constraints survive Blender storage
        run: |
          python3 tools/synthetic_sync/constraint_interactions.py --float32 \
            --out "${RUNNER_TEMP}/synthetic-blender/constraint-float32"
          blender --factory-startup --disable-autoexec -b --python-exit-code 1 \
            --python tools/synthetic_sync/blender_case.py -- \
            --case tools/synthetic_sync/cases/plane-mirror-parallel.json \
            --out "${RUNNER_TEMP}/synthetic-blender/constraint-interactions" --roundtrip
          python3 tools/synthetic_sync/constraint_interactions.py \
            --case tools/synthetic_sync/cases/plane-mirror-parallel.json \
            --result "${RUNNER_TEMP}/synthetic-blender/constraint-interactions/result.json" \
            --out "${RUNNER_TEMP}/synthetic-blender/constraint-interactions/checked"
          python3 tools/synthetic_sync/constraint_interactions.py \
            --case tools/synthetic_sync/cases/plane-mirror-parallel.json \
            --result "${RUNNER_TEMP}/synthetic-blender/constraint-interactions/reopened/result.json" \
            --out "${RUNNER_TEMP}/synthetic-blender/constraint-interactions/reopened/checked"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-blender
          path: ${{ runner.temp }}/synthetic-blender
          retention-days: 14
