name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BLENDER_VERSION: "5.1.2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "Tag must be vMAJOR.MINOR.PATCH, got ${TAG}" >&2
              exit 1
              ;;
          esac
          grep -q "^version = \"${VERSION}\"" blender_manifest.toml
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Unit tests
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy
          ./scripts/run-unittests.sh

      - name: Cache OpenCV wheels
        uses: actions/cache@v4
        with:
          path: wheels/*.whl
          key: opencv-wheels-${{ hashFiles('scripts/fetch-wheels.sh', 'blender_manifest.toml') }}

      - name: Fetch OpenCV wheels
        run: ./scripts/fetch-wheels.sh

      - name: Cache Blender tarball
        id: blender-tarball
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/blender.tar.xz
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Download Blender
        if: steps.blender-tarball.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 3 -o "${RUNNER_TEMP}/blender.tar.xz" \
            "https://download.blender.org/release/Blender${BLENDER_VERSION%.*}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglu1-mesa libxi6 libxrender1 libxkbcommon0 libsm6 libice6 libxxf86vm1
          mkdir -p "${HOME}/blender"
          tar -xJf "${RUNNER_TEMP}/blender.tar.xz" -C "${HOME}/blender" --strip-components=1
          echo "${HOME}/blender" >> "$GITHUB_PATH"

      - name: Validate and build extension zips
        run: |
          blender --factory-startup --command extension validate
          blender --factory-startup --command extension build --split-platforms
          ls -lh match_perspective-${{ steps.version.outputs.version }}-*.zip

      - name: Release notes
        run: |
          python3 scripts/changelog.py notes "${{ steps.version.outputs.version }}" \
            > "${RUNNER_TEMP}/release-notes.md"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            match_perspective-${{ steps.version.outputs.version }}-*.zip \
            --title "Perspective Match ${{ steps.version.outputs.version }}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            --verify-tag
